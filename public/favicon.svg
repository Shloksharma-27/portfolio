<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="cyberGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f0ff" />
      <stop offset="100%" stop-color="#8b5cf6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <rect width="100" height="100" rx="24" fill="#070b14" />
  <circle cx="50" cy="50" r="32" stroke="url(#cyberGlow)" stroke-width="2.5" stroke-dasharray="6 4" opacity="0.8" />
  <circle cx="50" cy="50" r="22" stroke="#00f0ff" stroke-width="1.5" opacity="0.6" />
  <polygon points="50,26 68,62 32,62" stroke="url(#cyberGlow)" stroke-width="2" fill="none" />
  <circle cx="50" cy="50" r="8" fill="#00f0ff" filter="url(#glow)" />
  <circle cx="50" cy="26" r="3" fill="#00f0ff" />
  <circle cx="68" cy="62" r="3" fill="#8b5cf6" />
  <circle cx="32" cy="62" r="3" fill="#00f0ff" />
</svg>